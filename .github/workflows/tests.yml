name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check app.js
      - run: node --check i18n.js
      - run: node --check game.js
      - run: node --check server/server.js
      - run: node --check server/security.js
      - name: Check Arena browser modules
        run: for file in hub/shared/*.js; do node --check "$file"; done
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
